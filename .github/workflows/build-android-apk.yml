name: Compiler une app Android (gratuit)

# Compile sur les serveurs GitHub (eas build --local) : ne consomme pas le quota Expo.
# La clé de signature est récupérée automatiquement chez Expo via EXPO_TOKEN.

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App à compiler"
        required: true
        default: enatega-multivendor-rider
        type: choice
        options:
          - enatega-multivendor-rider
          - enatega-multivendor-app
          - enatega-multivendor-store
      profile:
        description: "Profil EAS"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: ${{ inputs.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Libérer de l'espace disque
        working-directory: .
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true

      - name: Installer EAS
        run: npm install -g eas-cli

      - name: Installer les dépendances
        run: |
          if [ -f package-lock.json ]; then npm ci --legacy-peer-deps || npm install --legacy-peer-deps; else npm install --legacy-peer-deps; fi

      - name: Compiler l'APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_NO_VCS: "1"
        run: |
          eas build --local --platform android --profile ${{ inputs.profile }} --non-interactive --output "$GITHUB_WORKSPACE/app.apk"

      - name: Mettre l'APK à télécharger
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app }}-${{ inputs.profile }}-apk
          path: app.apk
          retention-days: 14
